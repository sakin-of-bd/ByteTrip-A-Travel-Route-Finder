<!DOCTYPE html>
<html>
<head>
    <title>Travel Route Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <nav>
            <img class="logo" src="{{ url_for('static', filename='road.jpg') }}" alt="logo">
            <h1>ByteTrip: Code your route, Byte your trip.</h1>
        </nav>

        <form method="POST" style="margin-top: 20px;">
            <label>From:</label>
            <select name="start" required>
                {% for district in districts %}
                    <option value="{{ district }}">{{ district }}</option>
                {% endfor %}
            </select>

            <label>To:</label>
            <select name="end" required>
                {% for district in districts %}
                    <option value="{{ district }}">{{ district }}</option>
                {% endfor %}
            </select>

            <button type="submit">Find Routes</button>
        </form>
    </div>
</body>
</html>
